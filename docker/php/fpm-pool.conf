; The application's PHP-FPM pool (architecture §20.1). The stock pool runs at most five
; workers, which caps a container far below the 50–150 requests per second the budgets
; assume; each worker needs ~60–90 MB, so 32 fit an 8 GB container with room to spare.
; Every value can be changed per deployment through the environment.
[www]
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE}
pm.max_requests = ${PHP_FPM_MAX_REQUESTS}
; A request running longer than this has its PHP stack written to the container log (0 = off).
request_slowlog_timeout = ${PHP_FPM_SLOWLOG_TIMEOUT}
slowlog = /proc/self/fd/2
