# Low-Code Framework — local and single-host deployment stack.
# Step-by-step instructions for Linux, macOS, and Windows: README.md ("Run it with
# Docker"). In short:
#
#   cp .env.example .env                    # container passwords
#   cp backend/.env.example backend/.env    # application settings: same DB_PASSWORD
#   docker compose build
#   docker compose run --rm --no-deps --entrypoint php app artisan key:generate --show
#                                           # paste the value after APP_KEY= in backend/.env
#   docker compose up -d --wait             # returns when every service is healthy
#   docker compose exec app php artisan setup:token
#
# Open http://localhost:8080 and complete the setup wizard.
#
# The "app" and "web" images are always built from this checkout (pull_policy:
# build), never pulled; "worker" and "scheduler" reuse the app image.

x-app: &app
  image: lcf/app:local
  env_file: backend/.env
  volumes:
    - files:/var/www/backend/storage/app
    - logs:/var/www/backend/storage/logs
  restart: unless-stopped

services:
  app:
    <<: *app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: app
    pull_policy: build
    environment:
      LCF_ROLE: app
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "0"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Healthy once the entrypoint has prepared the database and php-fpm listens.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 300s

  worker:
    <<: *app
    pull_policy: never
    environment:
      LCF_ROLE: worker
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "0"
    command: ["php", "artisan", "horizon"]
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    pull_policy: never
    environment:
      LCF_ROLE: scheduler
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "0"
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  web:
    image: lcf/web:local
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    pull_policy: build
    ports: ["8080:8080"]
    depends_on:
      app:
        condition: service_healthy
    # /up boots the application through php-fpm.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/up"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-lcf}
      MYSQL_USER: ${DB_USERNAME:-lcf}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    volumes: [mysql:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  # Started only with --profile sqlsrv. MSSQL_SA_PASSWORD must meet the SQL
  # Server password policy (at least 8 characters from three of: upper case,
  # lower case, digits, symbols); SQL Server refuses to start otherwise.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    profiles: ["sqlsrv"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
      MSSQL_COLLATION: Arabic_100_CI_AI_SC
    ports: ["1433:1433"]
    volumes: [mssql:/var/opt/mssql]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["dev"]
    ports: ["8025:8025"]

volumes:
  files:
  logs:
  mysql:
  mssql:
  redis:
