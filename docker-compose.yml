# Low-Code Framework — local and single-host deployment stack.
#
#   cp .env.example .env                        # database passwords for the containers
#   cp backend/.env.example backend/.env        # then set APP_KEY and the same passwords
#   docker compose up -d --build                # MySQL (default)
#   docker compose --profile sqlsrv up -d       # also start SQL Server; set DB_CONNECTION=sqlsrv
#   docker compose logs app | grep -A1 token    # one-time setup token
#
# Open http://localhost:8080 and complete the setup wizard.

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: app
  image: lcf/app:local
  env_file: backend/.env
  environment:
    PHP_OPCACHE_VALIDATE_TIMESTAMPS: "0"
  volumes:
    - files:/var/www/backend/storage/app
    - logs:/var/www/backend/storage/logs
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    environment:
      LCF_ROLE: app
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "0"
    volumes:
      - files:/var/www/backend/storage/app
      - logs:/var/www/backend/storage/logs
      # Shares the built public directory (index.php, assets) with nginx.
      - public:/var/www/backend/public

  worker:
    <<: *app
    environment:
      LCF_ROLE: worker
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "0"
    command: ["php", "artisan", "horizon"]
    depends_on: [app]

  scheduler:
    <<: *app
    environment:
      LCF_ROLE: scheduler
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "0"
    command: ["php", "artisan", "schedule:work"]
    depends_on: [app]

  web:
    image: nginx:1.27-alpine
    ports: ["8080:8080"]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public:/var/www/backend/public:ro
    depends_on: [app]
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-lcf}
      MYSQL_USER: ${DB_USERNAME:-lcf}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    volumes: [mysql:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    profiles: ["sqlsrv"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD}
      MSSQL_COLLATION: Arabic_100_CI_AI_SC
    ports: ["1433:1433"]
    volumes: [mssql:/var/opt/mssql]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["dev"]
    ports: ["8025:8025"]

volumes:
  files:
  logs:
  public:
  mysql:
  mssql:
  redis:
