name: CI

on:
  push:
    branches: [main, 'phase-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'
  PHP_EXTENSIONS: mbstring, intl, gd, zip, bcmath, pcntl, ldap, redis, pdo_mysql, sqlsrv, pdo_sqlsrv, exif, sodium

jobs:
  backend-quality:
    name: Backend lint & static analysis
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ env.PHP_VERSION }}', extensions: '${{ env.PHP_EXTENSIONS }}', coverage: none, tools: composer:v2 }
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress
      - name: Dependency vulnerabilities
        run: composer audit --no-interaction

  backend-tests:
    name: Backend tests (${{ matrix.db }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        db: [mysql, sqlsrv]
    services:
      mysql:
        image: ${{ matrix.db == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: "${{ format('ci-{0}-Aa1!', github.run_id) }}"
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 --silent" --health-interval=5s --health-retries=30
      sqlserver:
        image: ${{ matrix.db == 'sqlsrv' && 'mcr.microsoft.com/mssql/server:2019-latest' || '' }}
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: "${{ format('Ci-{0}-Pw0rd!', github.run_id) }}"
          MSSQL_COLLATION: Arabic_100_CI_AI_SC
        ports: ['1433:1433']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      APP_ENV: testing
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.db == 'mysql' && '3306' || '1433' }}
      DB_DATABASE: lcf_test
      DB_USERNAME: ${{ matrix.db == 'mysql' && 'root' || 'sa' }}
      DB_PASSWORD: ${{ matrix.db == 'mysql' && format('ci-{0}-Aa1!', github.run_id) || format('Ci-{0}-Pw0rd!', github.run_id) }}
      DB_ADMIN_PASSWORD: ${{ matrix.db == 'mysql' && format('ci-{0}-Aa1!', github.run_id) || format('Ci-{0}-Pw0rd!', github.run_id) }}
      DB_TRUST_SERVER_CERTIFICATE: 'true'
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - name: Microsoft ODBC Driver 18 (SQL Server only)
        if: matrix.db == 'sqlsrv'
        run: |
          if ! odbcinst -q -d 2>/dev/null | grep -q "ODBC Driver 18 for SQL Server"; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
          fi
          odbcinst -q -d
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ env.PHP_VERSION }}', extensions: '${{ env.PHP_EXTENSIONS }}', coverage: none, tools: composer:v2 }
      - run: composer install --no-interaction --no-progress --prefer-dist
        working-directory: backend
      - name: Throw-away application key for this run
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: php -m | grep -i -E 'sqlsrv|pdo_mysql' && php .github/scripts/prepare-database.php lcf_test
      - name: Pest (Feature, Integration, Unit) on ${{ matrix.db }}
        working-directory: backend
        run: php artisan test --log-junit ../junit-${{ matrix.db }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'backend-junit-${{ matrix.db }}', path: 'junit-${{ matrix.db }}.xml' }

  frontend:
    name: Frontend lint, types, unit tests, build
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx eslint .
      - run: npx prettier --check src e2e
      - run: npx vue-tsc -b
      - run: npx vitest run
      - run: NODE_ENV=production npx vite build
      - name: Dependency vulnerabilities
        run: npm audit --audit-level=high --omit=dev

  e2e:
    name: End-to-end (${{ matrix.db }})
    runs-on: ubuntu-24.04
    needs: [frontend]
    strategy:
      fail-fast: false
      matrix:
        db: [mysql, sqlsrv]
    services:
      mysql:
        image: ${{ matrix.db == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: "${{ format('ci-{0}-Aa1!', github.run_id) }}"
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 --silent" --health-interval=5s --health-retries=30
      sqlserver:
        image: ${{ matrix.db == 'sqlsrv' && 'mcr.microsoft.com/mssql/server:2019-latest' || '' }}
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: "${{ format('Ci-{0}-Pw0rd!', github.run_id) }}"
          MSSQL_COLLATION: Arabic_100_CI_AI_SC
        ports: ['1433:1433']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.db == 'mysql' && '3306' || '1433' }}
      DB_DATABASE: lcf_e2e
      DB_USERNAME: ${{ matrix.db == 'mysql' && 'root' || 'sa' }}
      DB_PASSWORD: ${{ matrix.db == 'mysql' && format('ci-{0}-Aa1!', github.run_id) || format('Ci-{0}-Pw0rd!', github.run_id) }}
      DB_ADMIN_PASSWORD: ${{ matrix.db == 'mysql' && format('ci-{0}-Aa1!', github.run_id) || format('Ci-{0}-Pw0rd!', github.run_id) }}
      DB_TRUST_SERVER_CERTIFICATE: 'true'
      SESSION_DRIVER: lcf-database
      CACHE_STORE: redis
      QUEUE_CONNECTION: sync
      REDIS_HOST: 127.0.0.1
      MAIL_MAILER: log
      LCF_E2E_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - name: Microsoft ODBC Driver 18 (SQL Server only)
        if: matrix.db == 'sqlsrv'
        run: |
          if ! odbcinst -q -d 2>/dev/null | grep -q "ODBC Driver 18 for SQL Server"; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
          fi
          odbcinst -q -d
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ env.PHP_VERSION }}', extensions: '${{ env.PHP_EXTENSIONS }}', coverage: none, tools: composer:v2 }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: composer install --no-interaction --no-progress --prefer-dist
        working-directory: backend
      - run: npm ci --no-audit --no-fund && NODE_ENV=production npx vite build && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Throw-away application key for this run
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: php .github/scripts/prepare-database.php lcf_e2e
      - name: Migrate, seed, and serve
        working-directory: backend
        run: |
          php artisan migrate --force --seed
          php artisan config:cache
          nohup php artisan serve --host=127.0.0.1 --port=8000 > ../serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/up && break; sleep 1; done
      - name: Playwright on ${{ matrix.db }}
        working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-${{ matrix.db }}
          path: |
            frontend/playwright-report
            frontend/test-results
            serve.log
            backend/storage/logs

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: app
          push: false
          tags: lcf/app:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: dev
          push: false
          tags: lcf/dev:ci
      - name: Compose file is valid
        run: |
          cp .env.example .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=x/; s/^DB_ROOT_PASSWORD=.*/DB_ROOT_PASSWORD=x/; s/^MSSQL_SA_PASSWORD=.*/MSSQL_SA_PASSWORD=x/' .env
          cp backend/.env.example backend/.env
          docker compose config --quiet
