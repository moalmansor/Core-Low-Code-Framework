name: CI

on:
  push:
    branches: [main, 'phase-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'
  PHP_EXTENSIONS: mbstring, intl, gd, zip, bcmath, pcntl, ldap, redis, pdo_mysql, sqlsrv, pdo_sqlsrv, exif, sodium

jobs:
  backend-quality:
    name: Backend lint & static analysis
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ env.PHP_VERSION }}', extensions: '${{ env.PHP_EXTENSIONS }}', coverage: none, tools: composer:v2 }
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress
      - name: Dependency vulnerabilities
        run: composer audit --no-interaction

  backend-tests:
    name: Backend tests (${{ matrix.db }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        db: [mysql, sqlsrv]
    services:
      mysql:
        image: ${{ matrix.db == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: "${{ format('ci-{0}-Aa1!', github.run_id) }}"
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 --silent" --health-interval=5s --health-retries=30
      sqlserver:
        image: ${{ matrix.db == 'sqlsrv' && 'mcr.microsoft.com/mssql/server:2019-latest' || '' }}
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: "${{ format('Ci-{0}-Pw0rd!', github.run_id) }}"
          MSSQL_COLLATION: Arabic_100_CI_AI_SC
        ports: ['1433:1433']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      APP_ENV: testing
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.db == 'mysql' && '3306' || '1433' }}
      DB_DATABASE: lcf_test
      DB_USERNAME: ${{ matrix.db == 'mysql' && 'root' || 'sa' }}
      DB_PASSWORD: ${{ matrix.db == 'mysql' && format('ci-{0}-Aa1!', github.run_id) || format('Ci-{0}-Pw0rd!', github.run_id) }}
      DB_ADMIN_PASSWORD: ${{ matrix.db == 'mysql' && format('ci-{0}-Aa1!', github.run_id) || format('Ci-{0}-Pw0rd!', github.run_id) }}
      DB_TRUST_SERVER_CERTIFICATE: 'true'
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - name: Microsoft ODBC Driver 18 (SQL Server only)
        if: matrix.db == 'sqlsrv'
        run: |
          if ! dpkg -s msodbcsql18 >/dev/null 2>&1; then
            if ! grep -rqs packages.microsoft.com /etc/apt/sources.list.d/; then
              curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
              echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
            fi
            sudo apt-get update
            sudo ACCEPT_EULA=Y DEBIAN_FRONTEND=noninteractive apt-get install -y msodbcsql18 unixodbc-dev
          fi
          odbcinst -q -d || true
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ env.PHP_VERSION }}', extensions: '${{ env.PHP_EXTENSIONS }}', coverage: none, tools: composer:v2 }
      - run: composer install --no-interaction --no-progress --prefer-dist
        working-directory: backend
      - name: Throw-away application key for this run
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: php -m | grep -i -E 'sqlsrv|pdo_mysql' && php .github/scripts/prepare-database.php lcf_test
      - name: Pest (Feature, Integration) on ${{ matrix.db }}
        working-directory: backend
        # An empty .env keeps phpdotenv from raising a file warning; configuration
        # comes from the job environment, which phpdotenv never overrides.
        run: |
          touch .env
          COLUMNS=250 php artisan test --display-warnings --fail-on-warning --log-junit ../junit-${{ matrix.db }}.xml
      - name: Error sink summary (on failure)
        if: failure()
        working-directory: backend
        run: |
          for f in storage/logs/testing/errors-*.log; do
            [ -f "$f" ] && php -r 'foreach (file($argv[1]) as $l) { $c = json_decode($l, true)["context"] ?? []; echo ($c["exception_class"] ?? "?"), " ", substr($c["message"] ?? "", 0, 300), " @ ", ($c["file"] ?? ""), ":", ($c["line"] ?? ""), PHP_EOL; }' "$f" | sort | uniq -c | sort -rn | head -40
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'backend-junit-${{ matrix.db }}', path: 'junit-${{ matrix.db }}.xml' }

  frontend:
    name: Frontend lint, types, unit tests, build
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx eslint .
      - run: node scripts/check-colors.mjs
      - run: npx prettier --check src e2e tests
      - run: npx vue-tsc -b
      - run: npx vitest run
      - run: NODE_ENV=production npx vite build
      - name: Dependency vulnerabilities
        run: npm audit --audit-level=high --omit=dev

  e2e:
    name: End-to-end (${{ matrix.db }})
    runs-on: ubuntu-24.04
    needs: [frontend]
    strategy:
      fail-fast: false
      matrix:
        db: [mysql, sqlsrv]
    services:
      mysql:
        image: ${{ matrix.db == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: "${{ format('ci-{0}-Aa1!', github.run_id) }}"
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 --silent" --health-interval=5s --health-retries=30
      sqlserver:
        image: ${{ matrix.db == 'sqlsrv' && 'mcr.microsoft.com/mssql/server:2019-latest' || '' }}
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: "${{ format('Ci-{0}-Pw0rd!', github.run_id) }}"
          MSSQL_COLLATION: Arabic_100_CI_AI_SC
        ports: ['1433:1433']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.db == 'mysql' && '3306' || '1433' }}
      DB_DATABASE: lcf_e2e
      DB_USERNAME: ${{ matrix.db == 'mysql' && 'root' || 'sa' }}
      DB_PASSWORD: ${{ matrix.db == 'mysql' && format('ci-{0}-Aa1!', github.run_id) || format('Ci-{0}-Pw0rd!', github.run_id) }}
      DB_ADMIN_PASSWORD: ${{ matrix.db == 'mysql' && format('ci-{0}-Aa1!', github.run_id) || format('Ci-{0}-Pw0rd!', github.run_id) }}
      DB_TRUST_SERVER_CERTIFICATE: 'true'
      SESSION_DRIVER: lcf-database
      CACHE_STORE: redis
      QUEUE_CONNECTION: sync
      REDIS_HOST: 127.0.0.1
      LCF_E2E_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - name: Microsoft ODBC Driver 18 (SQL Server only)
        if: matrix.db == 'sqlsrv'
        run: |
          if ! dpkg -s msodbcsql18 >/dev/null 2>&1; then
            if ! grep -rqs packages.microsoft.com /etc/apt/sources.list.d/; then
              curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
              echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
            fi
            sudo apt-get update
            sudo ACCEPT_EULA=Y DEBIAN_FRONTEND=noninteractive apt-get install -y msodbcsql18 unixodbc-dev
          fi
          odbcinst -q -d || true
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ env.PHP_VERSION }}', extensions: '${{ env.PHP_EXTENSIONS }}', coverage: none, tools: composer:v2 }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: composer install --no-interaction --no-progress --prefer-dist
        working-directory: backend
      - run: npm ci --no-audit --no-fund && NODE_ENV=production npx vite build && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Throw-away application key for this run
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: php .github/scripts/prepare-database.php lcf_e2e
      - name: Migrate, seed, and serve
        working-directory: backend
        run: |
          php artisan migrate --force --seed
          php artisan config:cache
          nohup php artisan serve --host=127.0.0.1 --port=8000 > ../serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/up && break; sleep 1; done
      - name: Playwright on ${{ matrix.db }}
        working-directory: frontend
        run: npx playwright test
      - name: Server logs (on failure)
        if: failure()
        run: |
          tail -n 150 serve.log || true
          tail -n 150 backend/storage/logs/*.log 2>/dev/null || true
          echo "--- server still answering?"; curl -s -o /dev/null -w '%{http_code}\n' --max-time 5 http://127.0.0.1:8000/up || true
          echo "--- server processes"; ps -eo pid,etime,args | grep -E 'artisan serve|php -S' | grep -v grep || true
          echo "--- crashes"; sudo dmesg 2>/dev/null | grep -iE 'segfault|killed process|oom' | tail -n 20 || true
          php -v; php -m | tr '\n' ' '; echo
          # Replay each form's publish analysis from the CLI against this run's database,
          # with and without the garbage collector, OPcache and the Redis cache, to locate a crash.
          cd backend
          printf '%s\n' '<?php' \
            'require "vendor/autoload.php"; $app = require "bootstrap/app.php";' \
            '$app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();' \
            'foreach (App\Modules\Forms\Models\Form::query()->get() as $form) {' \
            '  fwrite(STDERR, "analysing {$form->key}\n");' \
            '  try { $p = $app->make(App\Modules\Forms\Publishing\PublishService::class)->prepare($form); echo "{$form->key}: {$p["impact"]["schema"]["steps"]} steps\n"; }' \
            '  catch (Throwable $e) { echo "{$form->key}: ", get_class($e), " ", $e->getMessage(), "\n"; }' \
            '}' > /tmp/impact-probe.php
          for opts in "" "-d zend.enable_gc=0" "-d opcache.enable_cli=1"; do
            echo "--- probe php $opts"; rc=0; php $opts /tmp/impact-probe.php || rc=$?; echo "exit=$rc"
          done
          php artisan config:clear >/dev/null || true
          echo "--- probe with CACHE_STORE=file"; rc=0; CACHE_STORE=file php /tmp/impact-probe.php || rc=$?; echo "exit=$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-${{ matrix.db }}
          path: |
            frontend/playwright-report
            frontend/test-results
            serve.log
            backend/storage/logs

  line-endings:
    name: Line endings (Windows checkout)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Nothing is committed with CRLF
        run: |
          crlf=$(git ls-files --eol | awk '$1 == "i/crlf" { print $NF }')
          if [ -n "$crlf" ]; then echo "::error::Committed with CRLF line endings:"; echo "$crlf"; exit 1; fi
      - name: A Windows checkout (core.autocrlf=true) still gets LF everywhere
        run: |
          out="$RUNNER_TEMP/windows-checkout"
          git -c core.autocrlf=true checkout-index --all --force --prefix="$out/"
          cd "$out"
          crlf=$(grep -rlI --exclude='*.bat' --exclude='*.cmd' --exclude='*.ps1' $'\r' . || true)
          if [ -n "$crlf" ]; then echo "::error::These files get CRLF on Windows; fix .gitattributes:"; echo "$crlf"; exit 1; fi
          for f in docker/php/entrypoint.sh docker/php/Dockerfile docker/nginx/default.conf docker-compose.yml .env.example backend/.env.example; do
            head -c 64 "$f" | od -c | grep -q '\\r' && { echo "::error::$f has CRLF"; exit 1; }
          done
          echo "All $(git -C "$GITHUB_WORKSPACE" ls-files | wc -l) tracked files check out with LF under core.autocrlf=true."

  stack:
    name: Docker stack from a Windows checkout (${{ matrix.db }})
    runs-on: ubuntu-24.04
    needs: [line-endings]
    strategy:
      fail-fast: false
      matrix:
        db: [mysql, sqlsrv]
    env:
      STACK: ${{ github.workspace }}/../windows-checkout
      LCF_DB_PASSWORD: ${{ format('Db-{0}-pw', github.run_id) }}
      LCF_SA_PASSWORD: ${{ format('Sa-{0}-Pw!', github.run_id) }}
    steps:
      - uses: actions/checkout@v4
      # The stack is started from a checkout made the way Git for Windows makes
      # it (core.autocrlf=true), then exactly as the README's guide describes.
      - name: Windows-style checkout
        run: git -c core.autocrlf=true checkout-index --all --force --prefix="$STACK/"
      - name: Guide steps 2-4 — configuration files
        working-directory: ${{ env.STACK }}
        run: |
          cp .env.example .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=$LCF_DB_PASSWORD/; s/^DB_ROOT_PASSWORD=.*/DB_ROOT_PASSWORD=Root-$LCF_DB_PASSWORD/; s/^MSSQL_SA_PASSWORD=.*/MSSQL_SA_PASSWORD=$LCF_SA_PASSWORD/" .env
          cp backend/.env.example backend/.env
          if [ "${{ matrix.db }}" = sqlsrv ]; then
            sed -i "s/^DB_CONNECTION=.*/DB_CONNECTION=sqlsrv/; s/^DB_HOST=.*/DB_HOST=sqlserver/; s/^DB_PORT=.*/DB_PORT=1433/; s/^DB_USERNAME=.*/DB_USERNAME=sa/; s/^DB_PASSWORD=.*/DB_PASSWORD=$LCF_SA_PASSWORD/; s/^DB_TRUST_SERVER_CERTIFICATE=.*/DB_TRUST_SERVER_CERTIFICATE=true/" backend/.env
          else
            sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=$LCF_DB_PASSWORD/" backend/.env
          fi
      - name: Guide step 5 — build the images
        working-directory: ${{ env.STACK }}
        run: docker compose build
      - name: Guide step 6 — application key
        working-directory: ${{ env.STACK }}
        run: |
          key=$(docker compose run --rm --no-deps --entrypoint php app artisan key:generate --show --no-ansi | tr -d '\r' | tail -n 1)
          case "$key" in base64:*) ;; *) echo "::error::unexpected key output: $key"; exit 1 ;; esac
          sed -i "s#^APP_KEY=.*#APP_KEY=$key#" backend/.env
      - name: Guide step 7 — start the stack and wait until it is healthy
        working-directory: ${{ env.STACK }}
        run: |
          profile=""; [ "${{ matrix.db }}" = sqlsrv ] && profile="--profile sqlsrv"
          docker compose $profile up -d --wait --wait-timeout 600
          docker compose $profile ps
      - name: Every container is up, healthy, and never restarted
        working-directory: ${{ env.STACK }}
        run: |
          sleep 20
          for c in $(docker compose ps -q); do
            name=$(docker inspect -f '{{.Name}}' "$c"); state=$(docker inspect -f '{{.State.Status}}' "$c")
            health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$c")
            restarts=$(docker inspect -f '{{.RestartCount}}' "$c")
            echo "$name state=$state health=$health restarts=$restarts"
            [ "$state" = running ] && [ "$restarts" = 0 ] && [ "$health" != unhealthy ] || { echo "::error::$name is not healthy"; exit 1; }
          done
          for s in app web; do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q $s)")" = healthy ] || { echo "::error::$s is not healthy"; exit 1; }
          done
      - name: The application answers through nginx and the images carry no secrets
        working-directory: ${{ env.STACK }}
        run: |
          curl -fsS -o /dev/null -w 'GET /up -> %{http_code}\n' http://localhost:8080/up
          curl -fsS -o /dev/null -w 'GET /setup -> %{http_code}\n' http://localhost:8080/setup
          docker compose exec -T app sh -c 'test ! -e /var/www/backend/.env' || { echo "::error::backend/.env was baked into the app image"; exit 1; }
          docker compose exec -T app php artisan setup:token --no-ansi | tail -n 1 | grep -Eq '^[A-Za-z0-9_-]{20,}$'
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Playwright end-to-end suite against the stack
        working-directory: frontend
        env:
          LCF_E2E_URL: http://localhost:8080
          LCF_E2E_DOCKER: '1'
          LCF_E2E_COMPOSE_DIR: ${{ env.STACK }}
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Container logs (on failure)
        if: failure()
        working-directory: ${{ env.STACK }}
        run: docker compose --profile sqlsrv logs --no-color --tail 200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stack-${{ matrix.db }}
          path: |
            frontend/playwright-report
            frontend/test-results

  devcontainer:
    name: Dev container (Codespaces path)
    runs-on: ubuntu-24.04
    needs: [line-endings]
    env:
      # Since runner image 20261004, Compose builds through Buildx Bake, which
      # refuses to read the Dockerfile the devcontainer CLI writes to /tmp
      # without an fs.read entitlement the CLI cannot pass. The classic Compose
      # builder builds the same image.
      COMPOSE_BAKE: 'false'
    steps:
      - uses: actions/checkout@v4
      # Builds and starts .devcontainer the way Codespaces does (devcontainer CLI,
      # postCreate and postStart included), then checks the result from inside.
      - name: Start the dev container and verify it
        uses: devcontainers/ci@v0.3
        with:
          imageName: lcf-devcontainer
          push: never
          runCmd: |
            set -e
            curl -fsS -o /dev/null -w 'GET /up -> %{http_code}\n' http://127.0.0.1:8000/up
            curl -fsS -o /dev/null -w 'GET /setup -> %{http_code}\n' http://127.0.0.1:8000/setup
            cd backend
            php artisan setup:token --no-ansi | tail -n 1 | grep -Eq '^[a-f0-9-]{20,}$'
            DB_DATABASE=lcf_test php artisan db:ensure --no-interaction
            php artisan test --fail-on-warning

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: app
          push: false
          tags: lcf/app:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: dev
          push: false
          tags: lcf/dev:ci
      - name: The dev container's compose file needs no .env
        run: docker compose -f .devcontainer/docker-compose.devcontainer.yml config --quiet
      - name: Compose file is valid
        run: |
          cp .env.example .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=x/; s/^DB_ROOT_PASSWORD=.*/DB_ROOT_PASSWORD=x/; s/^MSSQL_SA_PASSWORD=.*/MSSQL_SA_PASSWORD=x/' .env
          cp backend/.env.example backend/.env
          docker compose config --quiet
