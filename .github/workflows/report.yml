name: Verification report

# The report in a pull request's description may only cite a CI run that finished, with every job passing, on
# the pull request's head commit (specification §8.2, ADR-0068). A push makes the old citation stale, so this
# check fails until CI has finished on the new head and the report cites that run; editing the description
# re-runs it.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  actions: read
  contents: read

concurrency:
  group: report-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cited-run:
    name: Report cites a finished CI run on the head commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/scripts }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --test .github/scripts/check-report.test.mjs
      # The description and head commit come from the event as environment values, never spliced into the script.
      - run: node .github/scripts/check-report.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
